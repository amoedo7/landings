name: demos-ci

on:
  push:
    paths:
      - 'demos/**'
      - '.amo'
      - 'scripts/autocheck.sh'
      - '.github/workflows/demos-ci.yml'
  pull_request:
    paths:
      - 'demos/**'
      - '.amo'
      - 'scripts/autocheck.sh'
      - '.github/workflows/demos-ci.yml'

permissions:
  contents: read

jobs:
  canonical-autocheck:
    name: Canonical AutoCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run canonical AutoCheck
        run: bash scripts/autocheck.sh

  file-integrity-contract:
    name: File integrity · ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify shared output contract
        run: python demos/file-integrity/test_contract.py

  midispositivo-schema:
    name: MiDispositivo · ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify safe default schema
        run: python demos/midispositivo/test_schema.py
